<script>
// 1. URL WEB APP GOOGLE APPS SCRIPT ANDA
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwz4wTltMk7YN2BYjDThgbPYnwOrfwTYPOXkkuPvJdFdjcMbHfKKJsqfeWpTcnTC6jPcg/exec';

// Konfigurasi Bawaan
const TARGET_LAT = -6.7220192;
const TARGET_LNG = 108.5364692;
const MAX_ALLOWED_RADIUS = 5.0;

let isHRAuthenticated = false;
let selectedIzinType = 'SAKIT';
let currentLat = null;
let currentLng = null;
let currentDistance = null;
let currentAddress = "Kost Andara Wijaya, Cirebon";
let videoStream = null;

// ==========================================
// FUNGSI PENGHUBUNG KE GOOGLE APPS SCRIPT (API)
// ==========================================
async function callGAS(action, dataObj = null) {
  const formData = new URLSearchParams();
  formData.append('action', action);
  if (dataObj) {
    formData.append('data', JSON.stringify(dataObj));
  }

  try {
    const response = await fetch(SCRIPT_URL, { method: 'POST', body: formData });
    return await response.json();
  } catch (error) {
    console.error('Fetch error:', error);
    return { success: false, message: 'Gagal terhubung ke server database (GAS).' };
  }
}

// ==========================================
// INISIALISASI APLIKASI
// ==========================================
window.addEventListener('DOMContentLoaded', function() {
  startLiveClock();
  const savedUser = localStorage.getItem('app_user_session');
  if (savedUser) {
    showMainApp(savedUser);
  } else {
    initCamera();
  }
});

function startLiveClock() {
  function update() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    const timeStr = `${hours}:${minutes}:${seconds}`;
    const clockEl = document.getElementById('live-clock');
    if (clockEl) clockEl.innerHTML = `${timeStr} <span>${ampm}</span>`;
    const dateStr = now.toLocaleDateString('id-ID', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    const dateEl = document.getElementById('live-date');
    if (dateEl) dateEl.innerText = dateStr;
  }
  update();
  setInterval(update, 1000);
}

function showStatus(elementId, msg, type) {
  const el = document.getElementById(elementId);
  if (el) {
    el.innerText = msg;
    el.className = `status-msg ${type}`;
    el.classList.remove('hidden');
  }
}

// ==========================================
// KAMERA & GPS
// ==========================================
async function initCamera() {
  const video = document.getElementById('webcam');
  const fallbackOverlay = document.getElementById('camera-fallback');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  try {
    if (videoStream) videoStream.getTracks().forEach(track => track.stop());
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 720 } },
      audio: false
    });
    if (video) {
      video.srcObject = videoStream;
      video.onloadedmetadata = () => video.play().catch(e => console.warn(e));
    }
    if (fallbackOverlay) fallbackOverlay.classList.add('hidden');
  } catch (err) {
    if (fallbackOverlay) fallbackOverlay.classList.remove('hidden');
  }
}

function requestCameraExplicitly() {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
    .then(stream => {
      if (videoStream) videoStream.getTracks().forEach(track => track.stop());
      videoStream = stream;
      const video = document.getElementById('webcam');
      const fallbackOverlay = document.getElementById('camera-fallback');
      if (video) { video.srcObject = stream; video.play().catch(e => console.warn(e)); }
      if (fallbackOverlay) fallbackOverlay.classList.add('hidden');
    }).catch(err => alert("Akses kamera ditolak."));
}

function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function initLocation() {
  const badge = document.getElementById('gps-status-badge');
  const coordsText = document.getElementById('gps-coords-text');
  if (!navigator.geolocation) {
    if (badge) { badge.className = "gps-status-badge out-of-range"; badge.innerHTML = `<i class="fa-solid fa-xmark"></i> GPS NOT SUPPORTED`; }
    return;
  }
  navigator.geolocation.watchPosition(
    pos => {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      currentDistance = calculateDistanceMeters(currentLat, currentLng, TARGET_LAT, TARGET_LNG);
      if (coordsText) coordsText.innerText = `${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`;
      if (currentDistance <= MAX_ALLOWED_RADIUS) {
        if (badge) { badge.className = "gps-status-badge"; badge.innerHTML = `<i class="fa-solid fa-check"></i> GPS LOCKED (${currentDistance.toFixed(1)}m)`; }
      } else {
        if (badge) { badge.className = "gps-status-badge out-of-range"; badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> OUT OF RANGE (${currentDistance.toFixed(1)}m)`; }
      }
    },
    err => {
      if (badge) { badge.className = "gps-status-badge out-of-range"; badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> GPS OFF`; }
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// ==========================================
// NAVIGASI & UI
// ==========================================
function showMainApp(userName) {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('main-app').classList.remove('hidden');
  document.getElementById('topbar-user-name').innerText = userName;
  switchTab('absen');
  initCamera();
  initLocation();
}

function switchTab(tabName) {
  const tabs = document.querySelectorAll('.tab-content');
  tabs.forEach(tab => tab.classList.add('hidden'));
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item => item.classList.remove('active'));

  if (tabName === 'absen') {
    document.getElementById('tab-absen').classList.remove('hidden');
    if (navItems[0]) navItems[0].classList.add('active');
    if (!videoStream) initCamera();
  } else if (tabName === 'hr') {
    document.getElementById('tab-hr').classList.remove('hidden');
    if (navItems[1]) navItems[1].classList.add('active');
  } else if (tabName === 'hari-kerja') {
    document.getElementById('tab-hari-kerja').classList.remove('hidden');
    if (navItems[2]) navItems[2].classList.add('active');
    loadHariKerjaStats();
  } else if (tabName === 'izin') {
    document.getElementById('tab-izin').classList.remove('hidden');
    if (navItems[3]) navItems[3].classList.add('active');
  }
}

// ==========================================
// FITUR UTAMA DENGAN API FETCH (callGAS)
// ==========================================
async function handleLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if (!u || !p) { showStatus('login-status', 'Username & Password wajib diisi!', 'error'); return; }

  showStatus('login-status', 'Memverifikasi Data...', 'success');
  const res = await callGAS('processLogin', { username: u, password: p });

  if (res.success) {
    localStorage.setItem('app_user_session', res.name);
    showMainApp(res.name);
  } else {
    showStatus('login-status', res.message, 'error');
  }
}

async function handleHRLogin() {
  const u = document.getElementById('hr-username').value.trim();
  const p = document.getElementById('hr-password').value.trim();
  
  showStatus('hr-login-status', 'Verifikasi HR...', 'success');
  const res = await callGAS('processLogin', { username: u, password: p });

  if (res.success && res.role === 'ADMIN') {
    isHRAuthenticated = true;
    document.getElementById('hr-login-box').classList.add('hidden');
    document.getElementById('hr-dashboard-box').classList.remove('hidden');
    loadSlipGaji();
  } else {
    showStatus('hr-login-status', 'Kredensial Admin HR Salah!', 'error');
  }
}

function lockHRAccess() {
  isHRAuthenticated = false;
  document.getElementById('hr-password').value = '';
  document.getElementById('hr-dashboard-box').classList.add('hidden');
  document.getElementById('hr-login-box').classList.remove('hidden');
}

function capturePhotoWithWatermark() {
  const video = document.getElementById('webcam');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 640;
  const ctx = canvas.getContext('2d');
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const now = new Date();
  const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const coordsStr = currentLat && currentLng ? `(${currentLat.toFixed(6)}, ${currentLng.toFixed(6)})` : '';

  ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
  ctx.fillRect(12, canvas.height - 68, canvas.width - 24, 56);
  ctx.fillStyle = "#38bdf8";
  ctx.fillRect(12, canvas.height - 68, 6, 56);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 13px Inter, Arial, sans-serif";
  ctx.fillText(`📍 ${currentAddress} ${coordsStr}`, 26, canvas.height - 44);
  ctx.fillStyle = "#cbd5e1";
  ctx.font = "12px Inter, Arial, sans-serif";
  ctx.fillText(`🕒 ${dateStr} - ${timeStr} WIB | CV. WIJAYA.GRUP`, 26, canvas.height - 22);

  return canvas.toDataURL('image/jpeg', 0.88);
}

async function submitAbsen(tipe) {
  if (!currentLat || !currentLng) {
    showStatus('absen-status', 'Gagal: Koordinat GPS belum terdeteksi!', 'error'); return;
  }
  if (currentDistance > MAX_ALLOWED_RADIUS) {
    showStatus('absen-status', `Gagal: Posisi Anda ${currentDistance.toFixed(1)} m dari lokasi (Maksimal 5.0 m)!`, 'error'); return;
  }

  showStatus('absen-status', 'Merekam presensi ke server, mohon tunggu...', 'success');
  const photoData = capturePhotoWithWatermark();
  const payload = { lat: currentLat, lng: currentLng, tipe: tipe, image: photoData };

  const res = await callGAS('processAbsen', payload);

  if (res.success) {
    showStatus('absen-status', res.message, 'success');
  } else {
    showStatus('absen-status', res.message, 'error');
    if (res.applyDendaPulangAwal) {
      callGAS('recordPulangAwalViolation');
    }
  }
}

function selectIzinCategory(type, element) {
  selectedIzinType = type;
  const cards = document.querySelectorAll('.option-card');
  cards.forEach(card => card.classList.remove('selected'));
  element.classList.add('selected');
}

async function submitIzin() {
  const alasan = document.getElementById('alasan-izin').value.trim();
  const payload = { jenis: selectedIzinType, alasan: alasan };
  
  showStatus('izin-status', 'Mengirim pengajuan izin...', 'success');
  const res = await callGAS('processIzin', payload);
  
  if (res.success) {
    showStatus('izin-status', res.message, 'success');
    document.getElementById('alasan-izin').value = '';
  } else {
    showStatus('izin-status', res.message, 'error');
  }
}

async function loadHariKerjaStats() {
  document.getElementById('hk-periode-label').innerText = "Memuat data...";
  const res = await callGAS('getHariKerjaData');
  
  if (res && res.periodeLabel) {
    document.getElementById('hk-periode-label').innerText = res.periodeLabel;
    document.getElementById('hk-val-masuk').innerText = res.totalMasuk + " Hari";
    document.getElementById('hk-val-komisi').innerText = `Rp${res.totalKomisi.toLocaleString('id-ID')}`;
    document.getElementById('hk-val-point').innerText = res.totalPoint + " Point";
    document.getElementById('hk-val-izin').innerText = res.totalIzin + " Hari";
  }
}

async function loadSlipGaji() {
  const res = await callGAS('getSlipGajiData');
  
  if (res && res.nama) {
    document.getElementById('slip-nama').innerText = res.nama;
    document.getElementById('slip-tgl-label').innerText = res.tanggalCetak;
    document.getElementById('slip-periode-label').innerText = "Periode Kerja: " + res.periode;
    document.getElementById('slip-periode').innerText = res.periode;
    document.getElementById('slip-hk').innerText = res.totalMasuk + " Hari";
    document.getElementById('slip-libur').innerText = res.totalIzin + " Hari";
    document.getElementById('slip-point').innerText = res.totalPoint + " Point";
    document.getElementById('slip-tamu').innerText = res.totalTamu + " Tamu";

    document.getElementById('slip-total-hk').innerText = `Rp${res.gajiPokok.toLocaleString('id-ID')}`;
    document.getElementById('slip-total-point').innerText = `Rp${res.komisiPoint.toLocaleString('id-ID')}`;
    document.getElementById('slip-total-komisi').innerText = `Rp${res.komisiTamu.toLocaleString('id-ID')}`;
    document.getElementById('slip-total-denda').innerText = `Rp${res.totalDenda.toLocaleString('id-ID')}`;
    document.getElementById('slip-grand-total').innerText = `Rp${res.gajiBersih.toLocaleString('id-ID')}`;

    document.getElementById('slip-detailed-notes').innerHTML = `
      <strong>Catatan Kehadiran (${res.periode}):</strong><br>
      - Tanggal Masuk: ${res.detailMasuk || '-'}<br>
      - Keterlambatan: ${res.detailTerlambat || '-'}<br>
      - Izin/Alfa: ${res.detailIzin || '-'}
    `;
  }
}

function downloadSlipPDF() {
  const element = document.getElementById('slip-pdf-wrapper');
  const opt = {
    margin: [5, 5, 5, 5],
    filename: `SLIP_GAJI_CV_WIJAYA_GRUP.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
  };
  html2pdf().set(opt).from(element).save();
}

async function sendSlipToGmail() {
  const htmlContent = document.getElementById('slip-pdf-wrapper').innerHTML;
  showStatus('email-status', 'Mengirim slip gaji ke Gmail karyawan...', 'success');
  
  const res = await callGAS('sendSlipGajiEmail', { htmlContent: htmlContent });
  
  if (res.success) {
    showStatus('email-status', res.message, 'success');
  } else {
    showStatus('email-status', res.message, 'error');
  }
}

function handleLogout() {
  localStorage.removeItem('app_user_session');
  lockHRAccess();
  if (videoStream) {
    videoStream.getTracks().forEach(track => track.stop());
    videoStream = null;
  }
  document.getElementById('main-app').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
}
</script>
